[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ramnet-ops"
version = "0.1.0rc2"
description = "PyTorch and CUDA operators for RAM-Net attention"
maintainers = [{name = "Kaicheng Xiao"}]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dynamic = ["dependencies"]
keywords = ["pytorch", "cuda", "attention", "ram-net"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

 [project.urls]
 Source = "https://github.com/MuonCat/RAM-Net"
 Issues = "https://github.com/MuonCat/RAM-Net/issues"
 Documentation = "https://github.com/MuonCat/RAM-Net/tree/main/packages/ramnet-ops"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["ramnet_ops", "ramnet_ops.*"]
namespaces = false
