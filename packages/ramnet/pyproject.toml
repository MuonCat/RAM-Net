[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ramnet"
version = "0.1.0rc0"
description = "RAM-Net layers and Hugging Face models"
maintainers = [{name = "Kaicheng Xiao"}, {name = "Haotian Li"}, {name = "Liran Dong"}]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "ramnet-ops>=0.1.0b0",
    "torch>=2.5",
    "einops",
    "transformers>=4.57.3",
    "flash-linear-attention>=0.3.2",
]
keywords = ["pytorch", "transformers", "attention", "ram-net"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

 [project.urls]
 Source = "https://github.com/MuonCat/RAM-Net"
 Issues = "https://github.com/MuonCat/RAM-Net/issues"
 Documentation = "https://github.com/MuonCat/RAM-Net/tree/main/packages/ramnet"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["ramnet", "ramnet.*"]
namespaces = false
