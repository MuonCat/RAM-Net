name: ramnet build

on:
  push:
    branches: [main]
    paths:
      - 'packages/ramnet/**'
      - '.github/workflows/ramnet-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install build and metadata tools
        run: python -m pip install build "twine>=6.2"
      - name: Build the pure Python wheel and source archive
        run: |
          python -m build --outdir dist packages/ramnet
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: ramnet-dist-wheel
          path: dist/*.whl
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: ramnet-dist-source
          path: dist/*.tar.gz
          if-no-files-found: error
